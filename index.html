    <script src="konva.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #stage-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #eee;
    }
    #special-button {
        position: fixed;
        top: 0;
        left: 0;
    }
    #special-button2 {
        position: absolute;
        top: 20%;

    }

<body>
  <div id="stage-container"></div>
    <script>
        Konva.enableTrace = true
        let stage;
        let layer;
    const func = async () => {
        stage = await Konva.Stage.create({ container: 'stage-container', width: 500, height: 500, x: 0, y: 0 });

        layer = new Konva.Layer(  );
        
    
        stage.add(layer);
    }
    
     let rects = [];
     let group
     const colors = ['red', 'black', 'blue', 'green', 'yellow', 'orange']
      func().then(async () => {
        group = new Konva.Group({
        width: 250,
        height: 50,
        x: 100,
         y: 100
    })
        layer.add(group)
        

        
            rects.push(new Konva.Rect({
            x: 0,
        y: 0,
        width: 100,
        height: 300,
        fillLinearGradientStartPoint: { x: 0, y: 0 },
        fillLinearGradientEndPoint: { x: 1, y: 0 },
        fillLinearGradientColorStops: [0, 'black', 1, 'transparent'],
        opacity: 0.3,
            }));
        group.add(rects[rects.length-1]);

        rects.push(new Konva.RegularPolygon({
           radius: 10, 
           sides: 3,
           rotation: 180
            }));
        group.add(rects[rects.length-1]);
     

        }) 
      
    const animation = new Konva.Animation(() => {
        layer.x(layer.x()+1)
    })
    
    const newFunc = () => {
        group.add(rects[rects.length-1])
    }
    const newFunc2 = () => {
        rects[rects.length-1].remove()
        console.log(group)
    }

    let lastTime = performance.now();
let frameCount = 0;
let fps = 0;


    </script>
    <button id="special-button" onclick="newFunc()"> LCIK ME</button>
    <button id="special-button2" onclick="newFunc2()"> NEW</button>
